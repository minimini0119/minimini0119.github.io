<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026新年快乐 | 跨年倒计时</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;}
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a0038, #000a3d, #140047);
            background-size: 200% 200%;
            animation: bgMove 10s ease infinite;
            font-family: '微软雅黑', sans-serif;
            overflow: hidden;
            color: #fff;
        }
        @keyframes bgMove {
            0% {background-position: 0% 0%;}
            50% {background-position: 100% 100%;}
            100% {background-position: 0% 0%;}
        }
        .title {font-size: 2.2rem;margin-bottom: 2rem;text-shadow: 0 0 20px #9933ff;}
        .countdown {
            display: flex;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        .time-box {
            text-align: center;
            padding: 1rem 1.5rem;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(153, 51, 255, 0.3);
        }
        .num {
            font-size: 3.5rem;
            font-weight: bold;
            color: #f0e6ff;
            text-shadow: 0 0 15px #c98fff;
        }
        .text {font-size: 0.9rem;color: #c7b3e8;margin-top: 0.5rem;}
        .year {font-size: 4rem;font-weight: bold;color: #fff;text-shadow: 0 0 30px #9933ff;margin-top: 1rem;}
        .tip {margin-top: 2rem;color: #b8a4e0;font-size: 1rem;}
        /* 烟花特效 */
        #fireworks {position: fixed;top: 0;left: 0;width: 100%;height: 100%;pointer-events: none;z-index: -1;}
        @media (max-width:768px) {
            .title {font-size: 1.8rem;}
            .countdown {gap: 0.8rem;}
            .num {font-size: 2.5rem;}
            .time-box {padding: 0.8rem 1rem;}
            .year {font-size: 3rem;}
        }
    </style>
</head>
<body>
    <canvas id="fireworks"></canvas>
    <div class="title">2026 甲辰龙年 · 跨年倒计时</div>
    <div class="countdown">
        <div class="time-box"><div class="num" id="days">00</div><div class="text">天</div></div>
        <div class="time-box"><div class="num" id="hours">00</div><div class="text">时</div></div>
        <div class="time-box"><div class="num" id="minutes">00</div><div class="text">分</div></div>
        <div class="time-box"><div class="num" id="seconds">00</div><div class="text">秒</div></div>
    </div>
    <div class="year">2026</div>
    <div class="tip">所求皆如愿，所行皆坦途 ✨</div>

    <script>
        // 目标时间：2026年1月1日 00:00:00 元旦跨年
        const targetDate = new Date('2026-01-01T00:00:00').getTime();
        
        // 倒计时核心
        function updateCountdown() {
            const now = new Date().getTime();
            const diff = targetDate - now;
            if (diff <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.querySelector('.title').textContent = '新年快乐 2026 🎉';
                return;
            }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 烟花特效
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
        window.addEventListener('resize', resizeCanvas);
        class Particle {
            constructor(x, y, color) {
                this.x = x;this.y = y;this.speed = Math.random() * 3 + 1;this.angle = Math.random() * Math.PI * 2;
                this.gravity = 0.02;this.vx = Math.cos(this.angle) * this.speed;this.vy = Math.sin(this.angle) * this.speed;
                this.alpha = 1;this.decay = Math.random() * 0.01 + 0.005;this.color = color;
            }
            update() {this.vy += this.gravity;this.x += this.vx;this.y += this.vy;this.alpha -= this.decay;}
            draw() {
                ctx.save();ctx.globalAlpha = this.alpha;ctx.beginPath();ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;ctx.fill();ctx.restore();
            }
        }
        function createFirework() {
            const x = Math.random() * canvas.width;const y = Math.random() * canvas.height / 2 + canvas.height / 4;
            const colors = ['#ff66cc','#9933ff','#66ccff','#ffcc66','#ffffff','#cc66ff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for(let i=0;i<100;i++) particles.push(new Particle(x, y, color));
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => {p.update();p.draw();});
            if(Math.random() < 0.03) createFirework();
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
